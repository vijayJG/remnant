[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remnant"
version = "0.1.0"
description = "Memory and history for your machine and code."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Vijayabalan J", email = "vijayjayagopan@email.com" }]
keywords = ["linux", "developer-tools", "cli", "memory", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
remnant = "remnant.cli:app"

[project.urls]
Homepage = "https://github.com/vijayJG/remnant"
Repository = "https://github.com/vijayJG/remnant"
Issues = "https://github.com/vijayJG/remnant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/remnant"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
